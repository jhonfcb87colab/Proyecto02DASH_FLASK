<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power BI Style Dashboard - Flask</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { background-color: #1e2229; color: #fff; min-height: 100vh; }
        .sidebar a { color: #adb5bd; text-decoration: none; display: block; padding: 12px 20px; }
        .sidebar a:hover, .sidebar a.active { background-color: #2b303b; color: #fff; border-left: 4px solid #0d6efd; }
        .kpi-card { border: none; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: transform 0.2s; }
        .kpi-card:hover { transform: translateY(-3px); }
        .chart-card { border: none; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Menú Lateral -->
        <div class="col-md-2 d-none d-md-block sidebar p-0">
            <div class="p-3 fs-5 fw-bold text-center border-bottom border-secondary">
                <i class="fa-solid fa-chart-line text-primary me-2"></i> Analytics BI
            </div>
            <div class="mt-3">
                <a href="#" class="active"><i class="fa-solid fa-house me-2"></i> Ventas</a>
                <a href="#"><i class="fa-solid fa-users me-2"></i> Clientes</a>
                <a href="#"><i class="fa-solid fa-box me-2"></i> Inventario</a>
                <a href="#"><i class="fa-solid fa-gear me-2"></i> Configuración</a>
            </div>
        </div>

        <!-- Contenido Principal -->
        <div class="col-md-10 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Panel de Control de Ventas</h2>
                <button class="btn btn-outline-primary btn-sm" onclick="cargarDatos()">
                    <i class="fa-solid fa-rotate me-1"></i> Actualizar Datos
                </button>
            </div>

            <!-- Fila 1: Tarjetas KPI -->
            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <div class="card kpi-card p-3 bg-white">
                        <div class="text-muted small">Ventas Totales</div>
                        <div class="fs-3 fw-bold text-primary" id="kpi-ventas">$0</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card kpi-card p-3 bg-white">
                        <div class="text-muted small">Transacciones</div>
                        <div class="fs-3 fw-bold text-success" id="kpi-transacciones">0</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card kpi-card p-3 bg-white">
                        <div class="text-muted small">Ticket Promedio</div>
                        <div class="fs-3 fw-bold text-warning" id="kpi-ticket">$0</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card kpi-card p-3 bg-white">
                        <div class="text-muted small">Satisfacción</div>
                        <div class="fs-3 fw-bold text-info" id="kpi-csat">0%</div>
                    </div>
                </div>
            </div>

            <!-- Fila 2: Gráficos -->
            <div class="row g-3 mb-4">
                <div class="col-md-8">
                    <div class="card chart-card p-3 bg-white">
                        <h6 class="fw-bold mb-3">Tendencia de Ventas Mensuales</h6>
                        <canvas id="chartLine" height="110"></canvas>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card chart-card p-3 bg-white">
                        <h6 class="fw-bold mb-3">Distribución por Categoría</h6>
                        <canvas id="chartDoughnut" height="230"></canvas>
                    </div>
                </div>
            </div>

            <!-- Fila 3: Tabla de Datos -->
            <div class="card chart-card p-3 bg-white">
                <h6 class="fw-bold mb-3">Top Productos Más Vendidos</h6>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Código</th>
                                <th>Producto</th>
                                <th>Unidades</th>
                                <th>Monto Total</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-productos"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
let lineChart, doughnutChart;

async function cargarDatos() {
    const res = await fetch('/api/data');
    const data = await res.json();

    // 1. Cargar KPIs
    document.getElementById('kpi-ventas').innerText = '$' + data.kpis.total_ventas.toLocaleString();
    document.getElementById('kpi-transacciones').innerText = data.kpis.transacciones.toLocaleString();
    document.getElementById('kpi-ticket').innerText = '$' + data.kpis.ticket_promedio;
    document.getElementById('kpi-csat').innerText = data.kpis.satisfaccion;

    // 2. Gráfico de Líneas (Ventas)
    if (lineChart) lineChart.destroy();
    lineChart = new Chart(document.getElementById('chartLine'), {
        type: 'line',
        data: {
            labels: data.ventas_mensuales.labels,
            datasets: [{
                label: 'Ventas USD',
                data: data.ventas_mensuales.data,
                borderColor: '#0d6efd',
                backgroundColor: 'rgba(13, 110, 253, 0.1)',
                fill: true,
                tension: 0.3
            }]
        }
    });

    // 3. Gráfico de Dona (Categorías)
    if (doughnutChart) doughnutChart.destroy();
    doughnutChart = new Chart(document.getElementById('chartDoughnut'), {
        type: 'doughnut',
        data: {
            labels: data.ventas_categoria.labels,
            datasets: [{
                data: data.ventas_categoria.data,
                backgroundColor: ['#0d6efd', '#198754', '#ffc107', '#0dcaf0', '#6c757d']
            }]
        },
        options: { plugins: { legend: { position: 'bottom' } } }
    });

    // 4. Llenar Tabla de Productos
    const tbody = document.getElementById('tabla-productos');
    tbody.innerHTML = '';
    data.top_productos.forEach(p => {
        tbody.innerHTML += `<tr>
            <td><code>${p.id}</code></td>
            <td>${p.nombre}</td>
            <td>${p.ventas}</td>
            <td class="fw-bold">${p.total}</td>
        </tr>`;
    });
}

// Cargar la información tan pronto abra la página
window.onload = cargarDatos;
</script>
</body>
</html>
